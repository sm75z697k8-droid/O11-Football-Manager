name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
      - name: Verify project
        run: npm run check
      - name: Confirm GitHub Pages uses the GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          echo "GitHub Pages publishing source: ${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages is publishing the repository source rather than the compiled Vite app. Open Settings > Pages > Build and deployment > Source and choose GitHub Actions."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site serves compiled JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ]; then
            echo "::error::Deployment did not return a Pages URL."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6 7 8; do
            html="$(curl --fail --silent --show-error --location --max-time 15 --header 'Cache-Control: no-cache' "${SITE_URL}?o11_build=${GITHUB_SHA}" || true)"
            if printf '%s' "${html}" | grep -q '/O11-Football-Manager/assets/'; then
              echo "Compiled Vite assets are referenced by the published HTML."
              exit 0
            fi
            echo "Attempt ${attempt}: live HTML not yet serving compiled assets."
            sleep 8
          done
          echo "::error::GitHub Pages is not serving the compiled Vite output. Check Pages > Source and use GitHub Actions."
          exit 1
